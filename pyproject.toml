[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seu-reasoning-compression"
version = "0.1.0"
description = "ReBalance-based reasoning compression with dynamic lexical penalties and answer steering"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
license = {text = "Apache-2.0; third-party components retain their original licenses"}

[project.optional-dependencies]
data = ["datasets>=3,<5"]
test = ["pytest>=8,<9"]

[project.scripts]
rc-eval = "reasoning_compression.cli:main"

[tool.setuptools.packages.find]
include = ["reasoning_compression*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
